services:
  backend:
    image: apniko-backend:${APNIKO_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:?Set DB_URL to the managed MySQL JDBC URL with TLS verification}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME to the least-privilege application user}
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-2}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      APP_AUTH_COOKIE_ENABLED: "true"
      APP_AUTH_COOKIE_SECURE: "true"
    secrets:
      - db_password
      - jwt_secret
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      start_period: 90s
      retries: 5
    networks:
      - apniko

  frontend:
    image: apniko-frontend:${APNIKO_IMAGE_TAG:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_AUTH_COOKIE_MODE: "true"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - apniko

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      APNIKO_DOMAIN: ${APNIKO_DOMAIN:?Set APNIKO_DOMAIN to the public DNS hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for TLS certificate notices}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - apniko

secrets:
  db_password:
    file: ${DB_PASSWORD_FILE:-./secrets/db_password.txt}
  jwt_secret:
    file: ${JWT_SECRET_FILE:-./secrets/jwt_secret.txt}

volumes:
  caddy_data:
  caddy_config:

networks:
  apniko:
    driver: bridge
