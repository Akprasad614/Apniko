spring.application.name=apniko-backend

# Keep SpringDoc's resource resolver aligned with the explicitly pinned Swagger UI WebJar.
springdoc.swagger-ui.version=5.34.1

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/localcart?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Flyway is the only schema-changing mechanism. Existing local schemas must be
# explicitly baselined after matching the reviewed V1 snapshot.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=1
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Browser authentication uses an HttpOnly cookie. CI explicitly opts into bearer mode.
app.auth.cookie.enabled=${APP_AUTH_COOKIE_ENABLED:true}
app.auth.cookie.secure=${APP_AUTH_COOKIE_SECURE:false}
app.auth.cookie.name=${APP_AUTH_COOKIE_NAME:APNIKO_SESSION}

# Public authentication abuse protection (one instance; use shared storage before horizontal scaling).
security.auth.rate-limit.login.max-attempts=${AUTH_LOGIN_MAX_ATTEMPTS:5}
security.auth.rate-limit.registration.max-attempts=${AUTH_REGISTRATION_MAX_ATTEMPTS:3}
security.auth.rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}

# Generic retail imports are disabled until an owner has reviewed the source
# rights and configured the exact source identity on the runtime.
apniko.catalogue.import.approved-source.name=${APNIKO_CATALOGUE_SOURCE_NAME:}
apniko.catalogue.import.approved-source.url=${APNIKO_CATALOGUE_SOURCE_URL:}
apniko.catalogue.import.approved-source.license=${APNIKO_CATALOGUE_SOURCE_LICENSE:}
apniko.catalogue.import.approved-source.permission-reference=${APNIKO_CATALOGUE_SOURCE_PERMISSION_REFERENCE:}
apniko.catalogue.import.approved-source.rights-verified=${APNIKO_CATALOGUE_SOURCE_RIGHTS_VERIFIED:false}
apniko.catalogue.import.approved-source.commercial-use-permitted=${APNIKO_CATALOGUE_SOURCE_COMMERCIAL_USE_PERMITTED:false}
