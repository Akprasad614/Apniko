spring.application.name=localcart-backend

spring.datasource.url=jdbc:mysql://localhost:3306/localcart?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# Public auth endpoint abuse protection. Values can be overridden per environment.
security.auth.rate-limit.login.max-attempts=${AUTH_LOGIN_MAX_ATTEMPTS:5}
security.auth.rate-limit.registration.max-attempts=${AUTH_REGISTRATION_MAX_ATTEMPTS:3}
security.auth.rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
