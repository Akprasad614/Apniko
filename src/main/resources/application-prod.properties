# Production profile. All credentials are injected by the runtime, never committed.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# Production schema changes must be applied by a reviewed migration before rollout.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.auth.cookie.enabled=true
app.auth.cookie.secure=true
app.auth.cookie.name=APNIKO_SESSION

server.port=8080
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Keep OpenAPI/Swagger private in production. Operate the API through the reverse proxy.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Internal container health probes only; response details are not exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=OFF
