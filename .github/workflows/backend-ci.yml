name: Apniko Backend CI

on:
  push:
    branches:
      - main
      - "automation/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify backend and Phase 10 assets
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: localcart_ci_root_password
          MYSQL_DATABASE: localcart
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -uroot -plocalcart_ci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DB_PASSWORD: localcart_ci_root_password
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/localcart?allowPublicKeyRetrieval=true&useSSL=false

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Generate an ephemeral JWT secret for this CI run
        shell: bash
        run: echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Ensure Maven wrapper is executable
        run: chmod +x ./mvnw

      - name: Verify Phase 10 configuration and collections
        run: bash scripts/verify-phase10.sh

      - name: Run Maven verification and tests
        run: ./mvnw -B -ntp verify
