name: Verify GitHub Actions Pins

on:
  push:
    branches:
      - main
      - "automation/**"
    paths:
      - ".github/workflows/**"
      - "scripts/verify-workflow-pins.py"
      - ".github/dependabot.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/verify-workflow-pins.py"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pins:
    name: Reject mutable third-party GitHub Actions references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify third-party action and reusable-workflow pins
        run: python3 scripts/verify-workflow-pins.py
