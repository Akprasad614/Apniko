name: Apniko OSV Dependency Scan (Pull Requests)

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-pr:
    name: Check newly introduced dependency vulnerabilities
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.7.0
    with:
      scan-args: |-
        --licenses
        --recursive
        ./
      fail-on-vuln: true
